map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the service name after Compose replaces the backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Keep the original path, query string, browser Origin and external port.
    location ~ ^/(api/|ws/|health$|docs(?:/|$)|redoc$|openapi\.json$) {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router deep links must also work when opened directly or refreshed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
